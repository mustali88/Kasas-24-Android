name: Build KASAS 24 Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o KASAS24_Android_Bildirme_Projesi.zip -d .

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fix notification package version
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');for(const k of ['dependencies','devDependencies'])if(p[k]?.['@capacitor/local-notifications'])p[k]['@capacitor/local-notifications']='^6.1.3';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KASAS-24-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
